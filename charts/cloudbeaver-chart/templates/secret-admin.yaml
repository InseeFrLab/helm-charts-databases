apiVersion: v1
kind: Secret
metadata:
  name: {{ include "library-chart.fullname" . }}-admin
  labels:
    {{- include "library-chart.labels" . | nindent 4 }}
type: Opaque
stringData:
  CB_ADMIN_NAME: {{ .Values.security.username | quote }}
  CB_ADMIN_PASSWORD: {{ .Values.security.password | quote }}
