apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "library-chart.fullname" . }}-test-connection"
  labels:
    {{- include "library-chart.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test-success
spec:
  containers:
    - name: wget
      image: busybox
      command: ['wget']
      args: [{{ printf "%v://%v" (ternary "https" "http" (not (empty $.Values.ingress.tls))) .Values.ingress.hostname | quote }}]
  restartPolicy: Never
