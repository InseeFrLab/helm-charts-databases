{{- if .Values.route.enabled -}}
{{- $fullName := include "opensearch-dashboards.fullname" (index .Subcharts "opensearch-dashboards") -}}
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ $fullName | quote }}
  labels:
    {{- include "opensearch.labels" .Subcharts.opensearch | nindent 4 }}
  annotations:
    {{- include "opensearch.routeDashboard.annotations" . | nindent 4 }}
spec:
  host: {{ .Values.routeDashboard.hostname | quote }}
  path: /
  to:
    kind: Service
    name: {{ $fullName | quote }}
  port:
    targetPort: {{ (index .Values "opensearch-dashboards").service.port }}
  tls:
    termination: {{ .Values.routeDashboard.tls.termination | quote }}
    {{- if .Values.routeDashboard.tls.key }}
    key: {{ .Values.routeDashboard.tls.key | quote }}
    {{- end }}
    {{- if .Values.routeDashboard.tls.certificate }}
    certificate: {{ .Values.routeDashboard.tls.certificate | quote }}
    {{- end }}
    {{- if .Values.routeDashboard.tls.caCertificate }}
    caCertificate: {{ .Values.routeDashboard.tls.caCertificate | quote }}
    {{- end }}
    {{- if .Values.routeDashboard.tls.destinationCACertificate }}
    destinationCACertificate: {{ .Values.routeDashboard.tls.destinationCACertificate | quote }}
    {{- end }}
  wildcardPolicy: {{ .Values.routeDashboard.wildcardPolicy | quote }}
{{- end }}
