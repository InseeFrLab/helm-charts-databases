apiVersion: v1
kind: Service
metadata:
  name: {{ include "library-chart.fullname" . }}
  labels:
    {{- include "library-chart.labels" . | nindent 4 }}
spec:
  type: {{ .Values.networking.service.type | quote }}
  ports:
    - port: {{ .Values.networking.service.port | int }}
      targetPort: http
      protocol: TCP
      name: http
    {{- range $key, $value := .Values.coordinator.additionalExposedPorts }}
    - port: {{ $value.servicePort | int }}
      name: {{ $value.name | quote }}
      targetPort: {{ $value.port | int }}
      protocol: {{ $value.protocol | quote }}
    {{- end }}
  selector:
    {{- include "library-chart.selectorLabels" . | nindent 4 }}
    component: coordinator
