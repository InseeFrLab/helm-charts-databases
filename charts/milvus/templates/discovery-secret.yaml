{{- if .Values.discovery.enabled -}}
{{- $password := (fromYaml (index .Values.milvus.extraConfigFiles "user.yaml")).common.security.defaultRootPassword -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "discoverable-%s" (include "library-chart.fullname" .) | quote }}
  annotations:
    onyxia/discovery: "milvus"
type: Opaque
stringData:
  MILVUS_GRPC_URI: {{ printf "https://%s" .Values.ingress.hostnameGRPC | quote }}
  MILVUS_REST_URI: {{ printf "https://%s" .Values.ingress.hostnameREST | quote }}
  MILVUS_USERNAME: "root"
  MILVUS_PASSWORD: {{ $password | quote }}
  MILVUS_TOKEN: {{ printf "root:%s" $password | quote }}
{{- end -}}
